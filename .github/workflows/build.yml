name: React Build Develop
on:
  push:
    branches:
      - develop

env:
  DOCKER_REGISTRY: jindodog0
  DOCKER_REPOSITORY: recovery.front
  VERSION: 24

jobs:
  build:
    runs-on: ubuntu-latest
    environment: develop

    steps:
      - name: 1️⃣ 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: 2️⃣ Build
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.VERSION }}
          cache: npm

      - name: 3️⃣ npm install
        run: npm ci

      - name: 4️⃣ npm build
        run: npm run build:${{ github.ref_name }}

      - name: 5️⃣ Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 6️⃣ Build and push image
        run: |
          docker build -t ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}:${{ github.ref_name }} .
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}:${{ github.ref_name }}
